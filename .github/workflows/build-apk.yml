name: Compilar APK GYMSHERONSO

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar proyecto Android (conservando nuestro código)
        run: |
          mkdir -p /tmp/bak && cp -r lib test pubspec.yaml /tmp/bak/
          flutter create . --platforms=android --org com.sheronso --project-name gymsheronso
          rm -rf lib test pubspec.yaml
          cp -r /tmp/bak/lib /tmp/bak/test /tmp/bak/pubspec.yaml .
          python3 tool/patch_android.py

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Pruebas
        run: flutter test

      - name: Compilar APK
        run: flutter build apk --release

      - name: Renombrar
        run: cp build/app/outputs/flutter-apk/app-release.apk GYMSHERONSO.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GYMSHERONSO-apk
          path: GYMSHERONSO.apk

      - name: Publicar en Releases (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GYMSHERONSO.apk
